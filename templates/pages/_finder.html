<!-- Municipality Search Section -->
{% load humanize %}
<div class="bg-white border-b border-gray-200">
  <div class="mx-auto max-w-7xl px-4 py-5 sm:px-6 lg:px-8">

    <form id="home-search-form"
          action="/"
          method="get"
          hx-get="/"
          hx-trigger="submit, change, keyup changed delay:300ms"
          hx-target="#home-results"
          hx-swap="outerHTML"
          hx-push-url="true"
          class="max-w-5xl mx-auto space-y-3">

      <!-- Primary search row -->
      <div class="flex flex-col lg:flex-row gap-3">
        <div class="relative flex-1">
          <label for="search-input" class="sr-only">Search municipalities</label>
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input type="text"
                 name="q"
                 id="search-input"
                 value="{{ query }}"
                 placeholder="Search by city, town, or county name..."
                 autocomplete="off"
                 class="block w-full pl-11 pr-4 py-4 text-lg border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm"
                 aria-label="Search municipalities">
        </div>

        <div class="lg:w-60">
          <label for="state-filter" class="sr-only">Filter by state or province</label>
          <select name="state"
                  id="state-filter"
                  class="block w-full px-3 py-4 text-base border-2 border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm">
            <option value="">All states / provinces</option>
            {% for st in states %}
            <option value="{{ st }}" {% if st == state %}selected{% endif %}>{{ st }}</option>
            {% endfor %}
          </select>
        </div>

        <button type="button"
                id="use-location-btn"
                class="inline-flex items-center justify-center px-5 py-4 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium text-sm transition shadow-sm whitespace-nowrap"
                data-umami-event="homepage_geolocation">
          <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Use My Location
        </button>
      </div>

      <!-- Secondary actions -->
      <div class="flex flex-wrap items-center justify-between gap-3 text-sm">
        <button type="button"
                id="toggle-filters-btn"
                class="text-indigo-600 hover:text-indigo-800 font-medium"
                aria-expanded="false"
                aria-controls="advanced-filters">
          <span class="show-text">Show advanced filters</span>
          <span class="hide-text hidden">Hide advanced filters</span>
        </button>
        <a href="/municipalities"
           class="font-medium text-indigo-600 hover:text-indigo-800"
           data-umami-event="homepage_browse">
          Browse all {{ num_sites|default:0|intcomma }} municipalities &rarr;
        </a>
      </div>

      <!-- Advanced Filters (Collapsible) -->
      <div id="advanced-filters" class="hidden">
        <div class="flex flex-wrap gap-3 items-center p-4 bg-gray-50 rounded-lg border border-gray-200">

          <!-- Type Filter -->
          <div>
            <label for="kind-filter" class="sr-only">Filter by type</label>
            <select name="kind"
                    id="kind-filter"
                    class="px-3 py-2 text-sm border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              <option value="">All types</option>
              {% for k in kinds %}
              <option value="{{ k }}" {% if k == kind %}selected{% endif %}>{{ k|title }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Finance Filter Checkbox -->
          <div>
            <label class="inline-flex items-center gap-2 px-3 py-2 text-sm border border-gray-300 rounded-lg bg-white cursor-pointer hover:bg-gray-50 transition">
              <input type="checkbox"
                     name="has_finance"
                     id="finance-filter"
                     value="1"
                     {% if has_finance %}checked{% endif %}
                     class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
              <span>Has finance data ({{ finance_sites_count }})</span>
            </label>
          </div>

          <!-- Clear Filters Button -->
          <button type="button"
                  id="clear-filters-btn"
                  class="px-4 py-2 text-sm rounded-lg bg-red-100 text-red-700 hover:bg-red-200 border border-red-300 transition"
                  style="display: {% if query or state or kind or has_finance %}inline-block{% else %}none{% endif %};"
                  onclick="document.getElementById('search-input').value=''; document.getElementById('state-filter').value=''; document.getElementById('kind-filter').value=''; document.getElementById('finance-filter').checked=false; this.style.display='none'; if (window.htmx) { htmx.trigger(document.getElementById('home-search-form'), 'submit'); }">
            Clear filters
          </button>

        </div>
      </div>

      <input type="hidden" name="sort" value="{{ sort }}">
    </form>

  </div>
</div>
