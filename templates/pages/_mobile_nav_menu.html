<details class="relative md:hidden">

           aria-label="Open navigation menu"
           title="Menu">
    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </summary>
  <div class="absolute right-0 z-50 mt-2 w-56 rounded-lg border border-indigo-500/40 bg-indigo-700 p-2 shadow-lg">
    <ul class="space-y-1 text-sm">
      {% include 'pages/_nav_text_links.html' with link_class="block text-white hover:text-white hover:bg-white/10 px-3 py-2 rounded transition" event_name=event_name %}
    </ul>
  </div>
</details>
