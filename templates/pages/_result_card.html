{% load humanize %}
<a href="https://{{ site.subdomain }}.civic.band"
   class="group block rounded-lg border border-gray-200 bg-white p-4 hover:border-indigo-300 hover:shadow-md transition"
   data-umami-event="homepage_muni"
   data-umami-event-subdomain="{{ site.subdomain }}">
  <div class="flex items-start justify-between gap-2">
    <div class="min-w-0">
      <h3 class="font-semibold text-gray-900 group-hover:text-indigo-700 truncate">{{ site.name|default:site.subdomain }}</h3>
      <p class="text-sm text-gray-500">
        {{ site.state }}{% if site.kind %} · <span class="capitalize">{{ site.kind }}</span>{% endif %}
      </p>
    </div>
    <span class="text-indigo-600 transition-transform group-hover:translate-x-0.5" aria-hidden="true">&rarr;</span>
  </div>
  <div class="mt-3 flex flex-wrap items-center gap-2 text-xs text-gray-500">
    <span>{{ site.pages|default:0|intcomma }} pages</span>
    {% if site.has_finance_data %}
    <span class="inline-flex items-center rounded border border-green-200 bg-green-100 px-1.5 py-0.5 font-medium text-green-800">Finance data</span>
    {% endif %}
  </div>
</a>
