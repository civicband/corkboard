sources:
  docker:
    type: docker_logs
    exclude_containers:
      - vector

transforms:
  process:
    type: remap
    inputs: [docker]
    source: |
      # host label (falls back to docker's host if the env var is unset)
      .host = get_env_var("HOSTNAME_OVERRIDE") ?? .host

      # tag every line with the corkboard app and its compose service
      .app = "corkboard"
      .service = if exists(.labels."com.docker.compose.service") {
        .labels."com.docker.compose.service"
      } else {
        "unknown"
      }

      # if the container log line is JSON, parse it and lift its keys to the top
      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        obj = object!(parsed)
        # merge() overwrites existing keys with the app's, so the app's UTC ISO
        # timestamp wins over docker's (docker's stays as a fallback)
        . = merge(., obj)
        if .level != null {
          .level = downcase!(string!(.level))
        }
        del(.asctime)
        del(.levelname)
      } else {
        # plain-text lines (gunicorn/uvicorn bootstrap) still get tagged
        .logger = "corkboard"
        .level = "info"
      }
      del(.levelname)

sinks:
  victorialogs:
    type: elasticsearch
    inputs: [process]
    endpoints:
      - "${VL_ENDPOINT}"
    auth:
      strategy: basic
      user: "${VL_USER}"
      password: "${VL_PASSWORD}"
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    buffer:
      type: disk
      max_size: 536870912
      when_full: block
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: host,container_name
